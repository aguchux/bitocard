# Every push and pull request: lint, typecheck, build and test everything, then run the API tests again
# against real Postgres and Upstash-compatible Redis (the same services as the local Docker environment).
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bitocard
          POSTGRES_PASSWORD: bitocard
          POSTGRES_DB: bitocard_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bitocard -d bitocard_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 3s --health-retries 30
      redis-http:
        image: hiett/serverless-redis-http:latest
        env:
          SRH_MODE: env
          SRH_TOKEN: local_token
          SRH_CONNECTION_STRING: redis://redis:6379
        ports: ["8079:80"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint, typecheck, build and test (in-process database)
        run: npm run check

      - name: Check the Redis REST proxy
        run: |
          for i in $(seq 1 30); do
            curl -sf -X POST -H "Authorization: Bearer local_token" -H "Content-Type: application/json" -d '["PING"]' http://localhost:8079 && exit 0
            sleep 2
          done
          curl -s -i -X POST -H "Authorization: Bearer local_token" -H "Content-Type: application/json" -d '["PING"]' http://localhost:8079 || true
          docker ps -a
          docker logs "$(docker ps -aqf ancestor=hiett/serverless-redis-http:latest)" || true
          exit 1

      - name: API tests against Postgres and Redis
        run: npm run test:docker -w @bitocard/api
