# The images of BitoCard's and Udozo's apps for the Kubernetes cluster (deploy/k8s): every API and frontend in
# deploy/k8s/images.json (written by deploy/k8s/generate.mjs), built and pushed to GitHub's container registry as
# ghcr.io/<owner>/<image>:<commit> and :latest. Run by hand (Actions > Kubernetes images > Run workflow), all images or
# the ones named; nothing is deployed: deploy/k8s/deploy.sh pins the cluster to a commit's images and applies.
name: Kubernetes images

on:
  workflow_dispatch:
    inputs:
      only:
        description: Build only these images, comma separated (for example bitocard-storefront,udozo-api); empty builds all
        required: false

concurrency:
  group: k8s-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        env:
          ONLY: ${{ inputs.only }}
        run: |
          node -e '
            const all = require("./deploy/k8s/images.json");
            const only = (process.env.ONLY || "").split(",").map(s => s.trim()).filter(Boolean);
            const chosen = only.length ? all.filter(item => only.includes(item.name)) : all;
            if (!chosen.length) { console.error("No such image: " + only.join(", ")); process.exit(1); }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "images=" + JSON.stringify(chosen) + "\n");
          '

  build:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.images) }}
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            GIT_COMMIT_SHA=${{ github.sha }}
            ${{ matrix.args }}
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
