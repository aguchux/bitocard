# Udozo's certificate: the apex and its wildcard (resellers' store subdomains included), from the shared
# Let's Encrypt issuer (deploy/k8s/shared/issuer.yaml), renewed by cert-manager.
# Written by deploy/k8s/generate.mjs: change that file and run it again, never edit this one by hand.
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: udozo
spec:
  secretName: udozo-tls
  issuerRef: { name: letsencrypt, kind: Issuer }
  dnsNames: ["udozo.com", "*.udozo.com"]
  privateKey: { algorithm: ECDSA, size: 256, rotationPolicy: Always }
