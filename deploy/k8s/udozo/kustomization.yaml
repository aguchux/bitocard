# Udozo on Kubernetes: its API and scheduler, frontends, routes and Origin CA certificate, in the namespace
# `bitocard`. Applied with the rest by `kubectl apply -k deploy/k8s`, or alone by `kubectl apply -k deploy/k8s/udozo`
# (after deploy/k8s/shared once).
#
# Settings and secrets come from env/*.env, never committed: copy each from its *.env.example (deploy/k8s/init-env.sh).
# A generated ConfigMap or Secret is named with a hash of its contents, so a changed value rolls the pods using it.
# Written by deploy/k8s/generate.mjs: change that file and run it again, never edit this one by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bitocard

labels:
  - pairs:
      app.kubernetes.io/part-of: udozo

resources:
  - api.yaml
  - frontends.yaml
  - ingress.yaml
  - tls-store.yaml

configMapGenerator:
  # The API's settings that are not secret (origins, cookies, rate limits, Redis's address).
  - name: udozo-api-config
    envs: [env/api.config.env]
  # The addresses the frontends' servers call and link to.
  - name: udozo-web-config
    envs: [env/web.config.env]

secretGenerator:
  - name: udozo-api-secrets
    envs: [env/api.secret.env]
  - name: udozo-web-secrets
    envs: [env/web.secret.env]
  # Cloudflare's Origin CA certificate for udozo.com and *.udozo.com (deploy/k8s/origin-cert.sh). Named
  # exactly: the Ingresses and Traefik's default store find it by name.
  - name: udozo-tls
    type: kubernetes.io/tls
    files: [tls.crt=env/origin.pem, tls.key=env/origin.key]
    options:
      disableNameSuffixHash: true

# The images to run; deploy/k8s/deploy.sh pins each to the commit CI built (`kustomize edit set image`).
images:
  - { name: golojan/bitocard_udozo_api, newTag: latest }
  - { name: golojan/bitocard_udozo, newTag: latest }
  - { name: golojan/bitocard_udozo_shq, newTag: latest }
  - { name: golojan/bitocard_udozo_admin, newTag: latest }
  - { name: golojan/bitocard_udozo_connect, newTag: latest }
  - { name: golojan/bitocard_udozo_pos, newTag: latest }
  - { name: golojan/bitocard_udozo_verify, newTag: latest }
