# BitoCard's Next.js apps: a Deployment and a Service each.
# Written by deploy/k8s/generate.mjs: change that file and run it again, never edit this one by hand.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storefront
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: bitocard
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    rollingUpdate: { maxSurge: 0, maxUnavailable: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: storefront
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storefront
        app.kubernetes.io/part-of: bitocard
    spec:
      imagePullSecrets:
        - name: registry
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: web
          image: golojan/bitocard_storefront:latest
          ports:
            - { name: http, containerPort: 3000 }
          envFrom:
            - configMapRef:
                name: bitocard-web-config
          env:
            - { name: PORT, value: "3000" }
            - { name: SITE_URL, value: "https://bitocard.com" }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=160" }
            - name: STORE_SERVER_SECRET
              valueFrom:
                secretKeyRef:
                  name: bitocard-web-secrets
                  key: STORE_SERVER_SECRET
          readinessProbe:
            tcpSocket: { port: http }
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 10m, memory: 96Mi }
            limits: { memory: 320Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: storefront
  labels:
    app.kubernetes.io/name: storefront
    app.kubernetes.io/part-of: bitocard
spec:
  selector:
    app.kubernetes.io/name: storefront
  ports:
    - { name: http, port: 80, targetPort: http }
