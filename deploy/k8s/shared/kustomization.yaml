# What BitoCard and Udozo share on the cluster: the namespace, the image pull secret and the apps' network policy.
# Applied with the rest by `kubectl apply -k deploy/k8s`, or alone (first) by `kubectl apply -k deploy/k8s/shared`.
# Its secret comes from env/, never committed: copy it from its *.example (deploy/k8s/init-env.sh).
# (Each product's TLS certificate is its own: Cloudflare's Origin CA, in <product>/env, deploy/k8s/origin-cert.sh.)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bitocard

resources:
  - namespace.yaml
  - network-policy.yaml

# Named exactly (no hash): every product's pods find it by this name.
generatorOptions:
  disableNameSuffixHash: true

secretGenerator:
  # Pulls the images from Docker Hub (golojan/bitocard_*): an access token of the golojan account, read only.
  - name: registry
    type: kubernetes.io/dockerconfigjson
    files: [.dockerconfigjson=env/registry.dockerconfigjson]
