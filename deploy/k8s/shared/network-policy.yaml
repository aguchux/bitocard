# Every app in the namespace takes requests only from Traefik's namespace and from the namespace's own pods (frontends
# call their API's Service). Redis stays on Upstash, outside the cluster.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: apps
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - podSelector: {}
