# The Cloudflare Tunnel, the cluster's only way in (no load balancer, no public address, nothing to pay for):
# `cloudflared` connects out to Cloudflare and brings each visitor's request, already through Cloudflare's edge
# (HTTPS, WAF, caching), to Traefik inside the cluster, which routes it by host. Two connectors, so one restarting
# never drops the site; both share the tunnel's token (env/tunnel.secret.env, never committed).
#
# The tunnel is "remotely managed": its public hostnames live in Cloudflare (Zero Trust > Networks > Tunnels > the
# tunnel > Public hostnames), each sent to http://traefik.traefik.svc.cluster.local:80 (deploy/k8s/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
    spec:
      securityContext:
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2026.11.0
          args: [tunnel, --no-autoupdate, --metrics, "0.0.0.0:2000", run]
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel
                  key: TUNNEL_TOKEN
          ports:
            - { name: metrics, containerPort: 2000 }
          readinessProbe:
            httpGet: { path: /ready, port: metrics }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: metrics }
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: [ALL]
