# cert-manager, small for a low-traffic start: it only renews two certificates (bitocard and udozo) every 60 days.
# Its CRDs are installed with it; one replica each.
crds:
  enabled: true
extraArgs:
  - --dns01-recursive-nameservers-only
  - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
resources:
  requests: { cpu: 10m, memory: 32Mi }
  limits: { memory: 128Mi }
webhook:
  resources:
    requests: { cpu: 5m, memory: 16Mi }
    limits: { memory: 64Mi }
cainjector:
  resources:
    requests: { cpu: 5m, memory: 32Mi }
    limits: { memory: 128Mi }
startupapicheck:
  enabled: false
