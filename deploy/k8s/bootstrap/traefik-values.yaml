# Traefik routes every request by host to its app (Helm chart traefik/traefik; install.sh). Nothing reaches it from
# the internet directly: there is no load balancer and no public address. Visitors come through Cloudflare's edge,
# then the Cloudflare Tunnel (`cloudflared` pods, deploy/k8s/shared/tunnel.yaml), which connects out to Cloudflare and
# sends each request here over the cluster's own network, to the `web` entry point (plain HTTP inside the cluster;
# HTTPS ends at Cloudflare, which redirects plain HTTP itself with Always Use HTTPS).
#
# Forwarded headers are believed only from the cluster's own addresses (the tunnel's pods): Cloudflare puts the
# visitor's address in X-Forwarded-For, cloudflared passes it on, and Traefik adds the tunnel pod's. So the APIs
# (TRUST_PROXY=2: Traefik, then the tunnel) take the visitor's address, never one a client wrote.
#
# Never add a load balancer (a `LoadBalancer` Service) without meaning to: DigitalOcean charges for each one. Load
# balancers and volumes are managed only through kubectl, never DigitalOcean's control panel.
#
# One replica for a low-traffic start on one node (a restart is a few seconds); 2 once the node pool grows.
deployment:
  replicas: 1
ingressClass:
  enabled: true
  isDefaultClass: true
  name: traefik
providers:
  kubernetesIngress: {}
service:
  spec:
    type: ClusterIP
additionalArguments:
  - --entryPoints.web.forwardedHeaders.trustedIPs=10.0.0.0/8
  # Long requests (catalogue syncs, reports, uploads) are not cut short.
  - --entryPoints.web.transport.respondingTimeouts.readTimeout=300s
  - --entryPoints.web.transport.respondingTimeouts.writeTimeout=300s
accessLog:
  enabled: true
  format: json
resources:
  requests: { cpu: 20m, memory: 48Mi }
  limits: { memory: 192Mi }
