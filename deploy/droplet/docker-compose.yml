# The API on the DigitalOcean droplet: the API itself, the scheduler that runs its jobs, and Caddy in front.
# Lives in /opt/bitocard on the droplet; CI copies it there and runs deploy.sh with the image to run
# (.github/workflows/deploy-api.yml). Secrets are in /etc/bitocard/api.env, never in this repository.
# Runbook: deploy/droplet/README.md.
#
# Udozo's API (api.udozo.com, docs/UDOZO_SPINOFF_PLAN.md) runs here too, from the same image with its own database,
# Redis and secrets (/etc/udozo/api.env): `api-udozo` and `scheduler-udozo`, in the `udozo` profile, which deploy.sh
# switches on (COMPOSE_PROFILES in .env) once that file exists.
#
# Memory is capped per container, so on a small droplet a runaway API restarts itself instead of the kernel killing
# whatever it picks (Docker, SSH). The caps suit the 2 GB droplet; after a resize, raise them in /opt/bitocard/.env
# (API_MEMORY, API_HEAP_MB; README.md, Growing) and run `docker compose up -d`.
name: bitocard

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

services:
  api:
    image: ${API_IMAGE:?API_IMAGE is set by deploy.sh}
    env_file: /etc/bitocard/api.env
    environment:
      APP_ENV: production
      PORT: "3001"
      # One proxy (Caddy), which writes the visitor's address from Cloudflare's CF-Connecting-IP.
      TRUST_PROXY: "1"
      # Node's heap, kept inside the container's cap with room for buffers and Prisma's engine.
      NODE_OPTIONS: --max-old-space-size=${API_HEAP_MB:-768}
    mem_limit: ${API_MEMORY:-1024m}
    expose: ["3001"]
    init: true
    # Lets requests in flight finish when a deploy replaces the container.
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  # Calls each job in apps/api/cron.json on its schedule (UTC), straight to the API, never through Cloudflare.
  scheduler:
    image: ${API_IMAGE:?API_IMAGE is set by deploy.sh}
    command: ["node", "scripts/scheduler.mjs"]
    env_file: /etc/bitocard/api.env
    environment:
      API_INTERNAL_URL: http://api:3001
      NODE_OPTIONS: --max-old-space-size=48
    mem_limit: 96m
    healthcheck:
      disable: true
    init: true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  api-udozo:
    profiles: [udozo]
    image: ${API_IMAGE:?API_IMAGE is set by deploy.sh}
    env_file: /etc/udozo/api.env
    environment:
      APP_ENV: production
      # Set here, never only in the env file: this instance must always be Udozo's.
      APP_PRODUCT: udozo
      PORT: "3001"
      TRUST_PROXY: "1"
      NODE_OPTIONS: --max-old-space-size=${UDOZO_API_HEAP_MB:-384}
    mem_limit: ${UDOZO_API_MEMORY:-512m}
    expose: ["3001"]
    init: true
    stop_grace_period: 30s
    restart: unless-stopped
    logging: *logging

  scheduler-udozo:
    profiles: [udozo]
    image: ${API_IMAGE:?API_IMAGE is set by deploy.sh}
    command: ["node", "scripts/scheduler.mjs"]
    env_file: /etc/udozo/api.env
    environment:
      APP_PRODUCT: udozo
      API_INTERNAL_URL: http://api-udozo:3001
      NODE_OPTIONS: --max-old-space-size=48
    mem_limit: 96m
    healthcheck:
      disable: true
    init: true
    depends_on:
      api-udozo:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Cloudflare's origin certificates: api.bitocard.com (origin.pem, origin.key) and, for Udozo, api.udozo.com
      # (udozo-origin.pem, udozo-origin.key).
      - /etc/bitocard/certs:/etc/caddy/certs:ro
      # The sites deploy.sh enables (Udozo's).
      - ./sites-enabled:/etc/caddy/sites-enabled:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 96m
    depends_on:
      - api
    restart: unless-stopped
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
