<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop tab, my listings</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#c00b58}a:hover{color:#8f0842}
</style>
</helmet>
<div style="width: 390px; height: 1020px; box-sizing: border-box; background: #fcfdff; font-family: Inter, system-ui, sans-serif; color: #070f4c; position: relative; overflow: hidden">

  <header style="display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: #ffffff; border-bottom: 1px solid #e3e7f2">
    <a href="#" style="text-decoration: none; display: flex; align-items: baseline; font-size: 19px; font-weight: 800; letter-spacing: -0.02em">
      <span style="color: #070f4c">Bito</span><span style="color: #ff2382">card</span>
    </a>
    <span style="display: flex; align-items: center; gap: 8px">
      <button type="button" aria-label="Search" style="width: 40px; height: 40px; border-radius: 999px; border: 1px solid #e3e7f2; background: #ffffff; color: #070f4c; display: flex; align-items: center; justify-content: center">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      </button>
      <button type="button" aria-label="Account: profile, security, identity check, help, sign out" style="width: 40px; height: 40px; border-radius: 999px; border: 0; background: #070f4c; color: #ffffff; font: 700 13px Inter, sans-serif">AO</button>
    </span>
  </header>

  <section style="padding: 16px 16px 0">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 22px; font-weight: 800">Shop</h1>
      <a href="Post.dc.html" style="display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; background: #c00b58; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 14px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
        Post an ad
      </a>
    </div>
    <nav aria-label="Shop" style="display: flex; gap: 6px; margin-top: 14px; overflow: hidden">
      <sc-for list="{{pills}}" as="p" hint-placeholder-count="5">
        <a href="{{p.href}}" style="flex: none; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; text-decoration: none; font-size: 13px; font-weight: 600; background: {{p.bg}}; color: {{p.fg}}; border: {{p.border}}">{{p.label}}
          <sc-if value="{{p.badge}}" hint-placeholder-val="{{false}}"><span style="min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 999px; background: #c00b58; color: #ffffff; font-size: 11px; display: flex; align-items: center; justify-content: center">{{p.badge}}</span></sc-if>
        </a>
      </sc-for>
    </nav>
  </section>

  <section style="padding: 16px 16px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{stats}}" as="s" hint-placeholder-count="4">
      <div style="padding: 10px 8px; border-radius: 12px; background: #ffffff; border: 1px solid #e3e7f2; display: flex; flex-direction: column; gap: 2px">
        <strong style="font-size: 18px; font-weight: 800">{{s.value}}</strong>
        <span style="font-size: 11px; color: #4b5578; font-weight: 500">{{s.label}}</span>
      </div>
    </sc-for>
  </section>

  <section style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{listings}}" as="l" hint-placeholder-count="3">
      <article style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 16px; background: #ffffff; border: 1px solid #e3e7f2">
        <div style="display: flex; gap: 12px">
          <span style="width: 72px; height: 72px; flex: none; border-radius: 12px; background: {{l.tint}}"></span>
          <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span style="align-self: flex-start; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: {{l.statusBg}}; color: {{l.statusFg}}">{{l.status}}</span>
            <strong style="font-size: 14px; line-height: 1.3">{{l.title}}</strong>
            <span style="font-size: 13px; font-weight: 700">{{l.price}}</span>
            <span style="font-size: 12px; color: #4b5578">{{l.meta}}</span>
          </span>
        </div>
        <div style="display: flex; gap: 6px">
          <sc-for list="{{l.actions}}" as="a" hint-placeholder-count="3">
            <button type="button" style="flex: 1; height: 36px; border-radius: 10px; border: 1px solid #c9cee6; background: #ffffff; color: #070f4c; font: 600 13px Inter, sans-serif">{{a}}</button>
          </sc-for>
        </div>
      </article>
    </sc-for>
  </section>

  <nav aria-label="Account app" style="position: absolute; left: 0; right: 0; bottom: 0; height: 72px; padding-bottom: 8px; box-sizing: border-box; background: #ffffff; border-top: 1px solid #e3e7f2; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr))">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; font-size: 11px; font-weight: 600; color: {{t.color}}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{t.icon}}"></path></svg>
        {{t.label}}
      </a>
    </sc-for>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1020}}'>
class Component extends DCLogic {
  renderVals() {
    const pill = (label, on, badge, href) => ({ label, badge, href: href || '#', bg: on ? '#070f4c' : '#ffffff', fg: on ? '#ffffff' : '#070f4c', border: on ? '1px solid #070f4c' : '1px solid #c9cee6' });
    const ink = '#4b5578';
    return {
      pills: [pill('Browse', false, '', 'Main.dc.html'), pill('My listings', true, ''), pill('Messages', false, '2'), pill('Orders', false, '1'), pill('Favourites', false, ''), pill('Safe pay', false, '')],
      stats: [{ value: '3', label: 'Active' }, { value: '1', label: 'In review' }, { value: '248', label: 'Views, 30 d' }, { value: '12', label: 'Leads' }],
      listings: [
        { title: 'iPhone 13 Pro, 256 GB', price: '₦520,000', meta: '96 views · 5 chats · expires in 27 days', status: 'Active', statusBg: '#e8f6f1', statusFg: '#064c39', tint: '#e7e9f6', actions: ['Edit', 'Mark sold', 'Share'] },
        { title: 'Samsung 43" Smart TV', price: '₦185,000', meta: 'Sent 20 minutes ago', status: 'In review', statusBg: '#fff4e5', statusFg: '#8a4b00', tint: '#fff0f7', actions: ['Edit', 'Delete'] },
        { title: 'PS4 Slim, 2 pads', price: '₦160,000', meta: 'Expired 3 days ago', status: 'Expired', statusBg: '#eef1fb', statusFg: '#1d2873', tint: '#f3f6fd', actions: ['Renew', 'Delete'] },
      ],
      tabs: [
        { label: 'Home', color: ink, icon: 'm3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM9 22V12h6v10' },
        { label: 'Catalog', color: ink, icon: 'M4 3h6v7H4zM14 3h6v7h-6zM14 14h6v7h-6zM4 14h6v7H4z' },
        { label: 'Orders', color: ink, icon: 'M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1ZM16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11' },
        { label: 'Wallet', color: ink, icon: 'M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4' },
        { label: 'Crypto', color: ink, icon: 'M8 2a6 6 0 1 0 0 12A6 6 0 0 0 8 2Zm10.09 8.37A6 6 0 1 1 10.34 18M7 6h1v4M16.71 13.88l.7.71-2.82 2.82' },
        { label: 'Shop', color: '#c00b58', icon: 'm2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8M2 7h20M22 7v3a2 2 0 0 1-2 2 2.7 2.7 0 0 1-2-1 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2.7 2.7 0 0 1-4 0 2 2 0 0 1-4-1V7' },
      ],
    };
  }
}
</script>
</body>
</html>
