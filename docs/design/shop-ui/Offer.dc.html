<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Make an offer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#c00b58}a:hover{color:#8f0842}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #f3f6fd; font-family: Inter, system-ui, sans-serif; color: #070f4c; position: relative; overflow: hidden">
  <div style="position: absolute; inset: 0; background: rgba(4, 9, 53, 0.55)"></div>
  <section role="dialog" aria-modal="true" aria-labelledby="offer-title" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 20px 28px; border-radius: 24px 24px 0 0; background: #ffffff; display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #c9cee6"></span>
    <h2 id="offer-title" style="margin: 0; font-size: 19px; font-weight: 800">Make an offer</h2>
    <p style="margin: 0; font-size: 13px; color: #4b5578">Listed at <strong style="color: #070f4c">₦520,000</strong>, negotiable. The seller can accept, decline or reply in chat.</p>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{quick}}" as="q" hint-placeholder-count="3">
        <button type="button" style="height: 44px; border-radius: 12px; font: 700 14px Inter, sans-serif; border: {{q.border}}; background: {{q.bg}}; color: {{q.fg}}">{{q.label}}</button>
      </sc-for>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Your offer
      <span style="display: flex; align-items: center; height: 52px; border-radius: 12px; border: 2px solid #070f4c; overflow: hidden">
        <span style="padding: 0 14px; height: 100%; display: flex; align-items: center; background: #f3f6fd; font-weight: 800; font-size: 16px">₦</span>
        <input type="text" inputmode="numeric" value="490,000" style="flex: 1; min-width: 0; height: 100%; padding: 0 12px; border: 0; outline: none; font: 800 18px Inter, sans-serif; color: #070f4c">
      </span>
    </label>
    <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; line-height: 1.4">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; accent-color: #0b7a5c">
      If accepted, pay with Safe pay at this price
    </label>
    <a href="Chat.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 14px; background: #070f4c; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 15px">Send offer</a>
    <span style="text-align: center; font-size: 12px; color: #4b5578">Offers expire after 24 hours.</span>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (label, on) => ({ label, border: on ? '2px solid #070f4c' : '1px solid #c9cee6', bg: on ? '#f3f6fd' : '#ffffff', fg: '#070f4c' });
    return { quick: [chip('₦500,000', false), chip('₦490,000', true), chip('₦470,000', false)] };
  }
}
</script>
</body>
</html>
