<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Safe pay orders</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#c00b58}a:hover{color:#8f0842}
</style>
</helmet>
<div style="width: 390px; height: 900px; box-sizing: border-box; background: #fcfdff; font-family: Inter, system-ui, sans-serif; color: #070f4c; overflow: hidden">
  <header style="padding: 16px 16px 12px; background: #ffffff; border-bottom: 1px solid #e3e7f2">
    <h1 style="margin: 0; font-size: 22px; font-weight: 800">Safe pay orders</h1>
    <p style="margin: 4px 0 12px; font-size: 13px; color: #4b5578">Your gift card and airtime orders are in the Orders tab.</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; padding: 4px; border-radius: 12px; background: #f3f6fd">
      <button type="button" style="height: 38px; border-radius: 9px; border: 0; background: #ffffff; color: #070f4c; font: 700 14px Inter, sans-serif; box-shadow: 0 1px 3px rgba(7, 15, 76, 0.12)">Buying</button>
      <button type="button" style="height: 38px; border-radius: 9px; border: 0; background: transparent; color: #4b5578; font: 600 14px Inter, sans-serif">Selling <span style="color: #c00b58">• 1</span></button>
    </div>
  </header>
  <div style="padding: 12px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{orders}}" as="o" hint-placeholder-count="4">
      <a href="{{o.href}}" style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 16px; background: #ffffff; border: 1px solid #e3e7f2; text-decoration: none; color: #070f4c">
        <span style="display: flex; gap: 12px">
          <span style="width: 56px; height: 56px; flex: none; border-radius: 10px; background: {{o.tint}}"></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
            <span style="display: flex; justify-content: space-between; gap: 8px"><strong style="font-size: 14px">{{o.title}}</strong><span style="font-size: 11px; color: #4b5578; flex: none">{{o.ref}}</span></span>
            <span style="font-size: 13px; font-weight: 700">{{o.total}}</span>
            <span style="align-self: flex-start; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; background: {{o.bg}}; color: {{o.fg}}">{{o.status}}</span>
          </span>
        </span>
        <span style="font-size: 12px; color: #1d2873; padding-top: 8px; border-top: 1px solid #e3e7f2">{{o.next}}</span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const o = (title, ref, total, status, bg, fg, next, tint, href) => ({ title, ref, total, status, bg, fg, next, tint, href: href || '#' });
    return {
      orders: [
        o('iPhone 13 Pro, 256 GB', 'SP-000142', '₦530,400', 'Paid · held', '#e8f6f1', '#064c39', 'Meet Chinedu and give your release code after checking the phone.', '#e7e9f6', 'BuyerOrder.dc.html'),
        o('HP EliteBook 840 G6', 'SP-000139', '₦418,200', 'Awaiting payment', '#fff4e5', '#8a4b00', 'Accepted. Pay from your wallet within 18 hours.', '#f3f6fd'),
        o('3.5 kVA generator', 'SP-000131', '₦489,600', 'Sent', '#eef1fb', '#1d2873', 'On its way. Confirm when it arrives, or it releases on 29 Oct.', '#eef7f2'),
        o('PS5 controller', 'SP-000118', '₦61,200', 'Released', '#0b7a5c', '#ffffff', 'Completed 12 Oct. Leave a review.', '#fff0f7'),
      ],
    };
  }
}
</script>
</body>
</html>
