<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Switch country prompt</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#c00b58}a:hover{color:#8f0842}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #fcfdff; font-family: Inter, system-ui, sans-serif; color: #070f4c; position: relative; overflow: hidden">

  <header style="background: #070f4c; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between">
    <span style="display: flex; align-items: baseline; gap: 6px; font-size: 20px; font-weight: 800; letter-spacing: -0.02em">
      <span><span style="color: #ffffff">Bito</span><span style="color: #ff2382">card</span></span>
      <span style="font-size: 13px; font-weight: 600; color: #c9cee6">Shop</span>
    </span>
    <span style="font-size: 13px; color: #c9cee6; font-weight: 600">All countries</span>
  </header>

  <div style="padding: 16px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px" aria-hidden="true">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
      <span style="display: flex; flex-direction: column; border-radius: 16px; background: #ffffff; border: 1px solid #e3e7f2; overflow: hidden">
        <span style="height: 120px; background: {{c}}"></span>
        <span style="display: flex; flex-direction: column; gap: 6px; padding: 10px">
          <span style="height: 10px; width: 80%; border-radius: 4px; background: #e3e7f2"></span>
          <span style="height: 10px; width: 50%; border-radius: 4px; background: #e3e7f2"></span>
        </span>
      </span>
    </sc-for>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(4, 9, 53, 0.55)"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="switch-title" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 20px 28px; border-radius: 24px 24px 0 0; background: #ffffff; display: flex; flex-direction: column; gap: 14px">
    <span style="align-self: center; width: 40px; height: 4px; border-radius: 999px; background: #c9cee6"></span>
    <div style="display: flex; gap: 12px; align-items: center">
      <span style="width: 64px; height: 64px; flex: none; border-radius: 12px; background: #e7e9f6"></span>
      <span style="display: flex; flex-direction: column; gap: 3px">
        <strong style="font-size: 14px">iPhone 13 Pro, 256 GB</strong>
        <span style="font-size: 12px; color: #4b5578">Chinedu O. · Ikeja</span>
      </span>
    </div>
    <h2 id="switch-title" style="margin: 0; display: flex; align-items: center; gap: 10px; font-size: 19px; line-height: 1.3; font-weight: 800">
      <svg width="30" height="20" viewBox="0 0 3 2" aria-hidden="true" style="border-radius: 3px; flex: none"><rect width="1" height="2" fill="#008751"></rect><rect x="1" width="1" height="2" fill="#ffffff"></rect><rect x="2" width="1" height="2" fill="#008751"></rect></svg>
      This is in Nigeria
    </h2>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #1d2873">Switch to the Nigeria market to see prices in naira, chat with the seller and buy with Safe pay. We'll remember your choice.</p>
    <a href="Listing.dc.html" style="display: flex; align-items: center; justify-content: center; height: 50px; border-radius: 14px; background: #070f4c; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 15px">Switch to Nigeria</a>
    <button type="button" style="height: 46px; border-radius: 14px; border: 1px solid #c9cee6; background: #ffffff; color: #070f4c; font: 700 14px Inter, sans-serif">Keep browsing all countries</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { cards: ['#e7e9f6', '#fff0f7', '#eef7f2', '#f3f6fd', '#fff4e5', '#e7e9f6'] };
  }
}
</script>
</body>
</html>
