<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deals in Nigeria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#c00b58}a:hover{color:#8f0842}
</style>
</helmet>
<div style="width: 390px; height: 1200px; box-sizing: border-box; background: #fcfdff; font-family: Inter, system-ui, sans-serif; color: #070f4c; overflow: hidden">
  <header style="background: #070f4c; padding: 18px 16px 20px; color: #ffffff; display: flex; flex-direction: column; gap: 8px">
    <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: #ff7ab6">Deals</span>
    <h1 style="margin: 0; font-size: 24px; font-weight: 800">Real price drops near you</h1>
    <p style="margin: 0; font-size: 13px; line-height: 1.45; color: #c9cee6">A "was" price shows only when the item was on sale at it for at least 7 of the last 30 days.</p>
  </header>
  <div style="display: flex; gap: 6px; padding: 12px 16px; overflow: hidden; background: #ffffff; border-bottom: 1px solid #e3e7f2">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
      <button type="button" style="flex: none; height: 34px; padding: 0 12px; border-radius: 999px; font: 600 13px Inter, sans-serif; border: {{c.border}}; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button>
    </sc-for>
  </div>
  <div style="padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{deals}}" as="d" hint-placeholder-count="5">
      <a href="Listing.dc.html" style="display: flex; gap: 12px; padding: 10px; border-radius: 16px; background: #ffffff; border: 1px solid #e3e7f2; text-decoration: none; color: #070f4c">
        <span style="width: 92px; height: 92px; flex: none; border-radius: 12px; background: {{d.tint}}; position: relative"><span style="position: absolute; left: 6px; top: 6px; padding: 3px 7px; border-radius: 999px; background: #c00b58; color: #ffffff; font-size: 11px; font-weight: 800">{{d.off}}</span></span>
        <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="display: flex; align-items: baseline; gap: 8px"><strong style="font-size: 16px; font-weight: 800">{{d.price}}</strong><span style="font-size: 12px; color: #4b5578; text-decoration: line-through">{{d.was}}</span></span>
          <span style="font-size: 13px; font-weight: 500">{{d.title}}</span>
          <span style="font-size: 12px; color: #1d2873; font-weight: 600">{{d.shop}}</span>
          <span style="font-size: 12px; color: #4b5578">{{d.place}}</span>
        </span>
      </a>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1200}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = (label, on) => ({ label, border: on ? '1px solid #070f4c' : '1px solid #c9cee6', bg: on ? '#070f4c' : '#ffffff', fg: on ? '#ffffff' : '#070f4c' });
    return {
      chips: [chip('Biggest drop', true), chip('Phones', false), chip('Home', false), chip('Power', false), chip('Fashion', false)],
      deals: [
        { off: '−22%', price: '₦390,000', was: '₦500,000', title: 'Samsung Galaxy S23, 256 GB', shop: 'GadgetPlug', place: 'Ikeja · ✓ Verified business', tint: '#e7e9f6' },
        { off: '−15%', price: '₦255,000', was: '₦300,000', title: 'LG 1.5 HP split AC', shop: 'CoolHome', place: 'Surulere', tint: '#eef7f2' },
        { off: '−11%', price: '₦480,000', was: '₦540,000', title: '3.5 kVA generator', shop: 'PowerHub', place: 'Lekki · delivers nationwide', tint: '#fff4e5' },
        { off: '−10%', price: '₦265,000', was: '₦295,000', title: '400 W solar panel x2', shop: 'PowerHub', place: 'Lekki', tint: '#f3f6fd' },
        { off: '−8%', price: '₦46,000', was: '₦50,000', title: 'Ankara gown, made to measure', shop: 'Adire House', place: 'Yaba', tint: '#fff0f7' },
      ],
    };
  }
}
</script>
</body>
</html>
