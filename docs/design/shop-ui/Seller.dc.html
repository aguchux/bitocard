<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Seller profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#c00b58}a:hover{color:#8f0842}
</style>
</helmet>
<div style="width: 390px; height: 1100px; box-sizing: border-box; background: #fcfdff; font-family: Inter, system-ui, sans-serif; color: #070f4c; overflow: hidden">

  <header style="background: #070f4c; padding: 12px 16px 24px; color: #ffffff; display: flex; flex-direction: column; gap: 16px">
    <a href="Listing.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #ffffff">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"></path></svg>
    </a>
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 64px; height: 64px; border-radius: 999px; background: #ff2382; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800">CO</span>
      <span style="display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 20px; font-weight: 800">Chinedu O.</h1>
        <span style="font-size: 13px; color: #c9cee6">Ikeja, Lagos · since March 2026</span>
      </span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{stats}}" as="s" hint-placeholder-count="3">
        <div style="padding: 10px; border-radius: 12px; background: #111a5e; display: flex; flex-direction: column; gap: 2px">
          <strong style="font-size: 16px">{{s.value}}</strong>
          <span style="font-size: 11px; color: #c9cee6">{{s.label}}</span>
        </div>
      </sc-for>
    </div>
  </header>

  <section style="padding: 16px 16px 0; display: flex; flex-wrap: wrap; gap: 6px">
    <sc-for list="{{badges}}" as="b" hint-placeholder-count="3">
      <span style="display: flex; align-items: center; gap: 4px; padding: 5px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: {{b.bg}}; color: {{b.fg}}">{{b.label}}</span>
    </sc-for>
  </section>

  <section style="padding: 18px 16px 0">
    <h2 style="margin: 0 0 10px; font-size: 15px; font-weight: 700">Reviews <span style="font-weight: 500; color: #4b5578; font-size: 13px">from Safe pay buyers</span></h2>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{reviews}}" as="r" hint-placeholder-count="2">
        <article style="padding: 12px; border-radius: 14px; background: #ffffff; border: 1px solid #e3e7f2; display: flex; flex-direction: column; gap: 6px">
          <span style="display: flex; justify-content: space-between; font-size: 13px"><strong>{{r.name}}</strong><span style="color: #8a4b00; font-weight: 700" aria-label="{{r.aria}}">{{r.stars}}</span></span>
          <span style="font-size: 13px; line-height: 1.45; color: #1d2873">{{r.text}}</span>
          <span style="font-size: 11px; color: #4b5578">{{r.meta}}</span>
        </article>
      </sc-for>
    </div>
  </section>

  <section style="padding: 18px 16px 0">
    <h2 style="margin: 0 0 10px; font-size: 15px; font-weight: 700">Listings <span style="font-weight: 500; color: #4b5578; font-size: 13px">4</span></h2>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{listings}}" as="l" hint-placeholder-count="4">
        <a href="Listing.dc.html" style="display: flex; flex-direction: column; border-radius: 14px; background: #ffffff; border: 1px solid #e3e7f2; overflow: hidden; text-decoration: none; color: #070f4c">
          <span style="height: 100px; background: {{l.tint}}"></span>
          <span style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px 10px">
            <strong style="font-size: 14px; font-weight: 800">{{l.price}}</strong>
            <span style="font-size: 12px">{{l.title}}</span>
          </span>
        </a>
      </sc-for>
    </div>
  </section>

  <div style="padding: 16px">
    <a href="Report.dc.html" style="font-size: 13px; color: #4b5578">Report or block this seller</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1100}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      stats: [{ value: '4.8', label: 'Rating (11)' }, { value: '< 1 h', label: 'Replies' }, { value: '23', label: 'Safe pay sales' }],
      badges: [
        { label: '✓ Phone confirmed', bg: '#e8f6f1', fg: '#064c39' },
        { label: '✓ ID checked', bg: '#e8f6f1', fg: '#064c39' },
        { label: '✓ Safe pay seller', bg: '#e8f6f1', fg: '#064c39' },
      ],
      reviews: [
        { name: 'Bola A.', stars: '★★★★★', aria: '5 out of 5', text: 'Phone exactly as described. Met at Ikeja City Mall, quick hand-over.', meta: 'Safe pay · Samsung A54 · 2 weeks ago' },
        { name: 'Tunde K.', stars: '★★★★☆', aria: '4 out of 5', text: 'Good laptop, came 30 minutes late to the meet-up.', meta: 'Safe pay · HP laptop · 1 month ago' },
      ],
      listings: [
        { price: '₦520,000', title: 'iPhone 13 Pro', tint: '#e7e9f6' },
        { price: '₦38,000', title: 'AirPods (2nd gen)', tint: '#fff0f7' },
        { price: '₦210,000', title: 'iPad 9th gen', tint: '#eef7f2' },
        { price: '₦15,000', title: 'Anker power bank', tint: '#f3f6fd' },
      ],
    };
  }
}
</script>
</body>
</html>
