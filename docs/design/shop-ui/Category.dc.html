<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile phones in Ikeja</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#c00b58}a:hover{color:#8f0842}
</style>
</helmet>
<div style="width: 390px; height: 1300px; box-sizing: border-box; background: #fcfdff; font-family: Inter, system-ui, sans-serif; color: #070f4c; overflow: hidden">

  <header style="background: #070f4c; padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px">
      <a href="Main.dc.html" aria-label="Back" style="width: 40px; height: 40px; flex: none; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #ffffff">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"></path></svg>
      </a>
      <label style="flex: 1; display: flex; align-items: center; gap: 8px; height: 42px; padding: 0 12px; border-radius: 12px; background: #ffffff; color: #4b5578">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
        <input type="search" value="iphone" aria-label="Search" style="flex: 1; min-width: 0; border: 0; outline: none; font: 500 15px Inter, sans-serif; color: #070f4c">
      </label>
    </div>
    <span style="font-size: 13px; color: #c9cee6">Mobile phones · <strong style="color: #ffffff">Ikeja, Lagos</strong></span>
  </header>

  <div style="display: flex; gap: 6px; padding: 12px 16px; overflow: hidden; border-bottom: 1px solid #e3e7f2; background: #ffffff">
    <a href="Filters.dc.html" style="flex: none; display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: 999px; background: #070f4c; color: #ffffff; text-decoration: none; font-size: 13px; font-weight: 600">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M7 12h10M10 18h4"></path></svg>
      Filters <span style="min-width: 18px; height: 18px; border-radius: 999px; background: #ff2382; font-size: 11px; display: flex; align-items: center; justify-content: center">2</span>
    </a>
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
      <button type="button" style="flex: none; height: 36px; padding: 0 12px; border-radius: 999px; border: 1px solid #c9cee6; background: #ffffff; color: #070f4c; font: 600 13px Inter, sans-serif">{{c}}</button>
    </sc-for>
  </div>

  <div style="padding: 12px 16px 0; display: flex; justify-content: space-between; font-size: 13px; color: #4b5578">
    <span>Used · Up to ₦600,000</span>
    <span>Sort: <strong style="color: #070f4c">Newest</strong></span>
  </div>

  <sc-for list="{{tiers}}" as="t" hint-placeholder-count="3">
    <section style="padding: 16px 16px 0">
      <h2 style="margin: 0 0 10px; font-size: 15px; font-weight: 700">{{t.heading}} <span style="font-weight: 500; color: #4b5578; font-size: 13px">{{t.count}}</span></h2>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{t.items}}" as="l" hint-placeholder-count="2">
          <a href="Listing.dc.html" style="display: flex; gap: 12px; padding: 10px; border-radius: 16px; background: #ffffff; border: 1px solid #e3e7f2; text-decoration: none; color: #070f4c">
            <span style="width: 96px; height: 96px; flex: none; border-radius: 12px; background: {{l.tint}}"></span>
            <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1">
              <span style="display: flex; justify-content: space-between; gap: 8px">
                <strong style="font-size: 15px; font-weight: 800">{{l.price}}</strong>
                <span style="font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: #fff4e5; color: #8a4b00; align-self: flex-start">{{l.condition}}</span>
              </span>
              <span style="font-size: 13px; font-weight: 500; line-height: 1.3">{{l.title}}</span>
              <span style="font-size: 12px; color: #1d2873">{{l.features}}</span>
              <span style="font-size: 12px; color: #4b5578">{{l.place}}</span>
            </span>
          </a>
        </sc-for>
      </div>
    </section>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      chips: ['Storage', 'Brand', 'Price', 'Delivers to me'],
      tiers: [
        { heading: 'In Ikeja', count: '12', items: [
          { price: '₦520,000', condition: 'Used', title: 'iPhone 13 Pro, Sierra Blue', features: '256 GB · 6 GB RAM · Battery 88%', place: 'Ikeja · 2 h ago', tint: '#e7e9f6' },
          { price: '₦345,000', condition: 'Used', title: 'iPhone 12, Black', features: '128 GB · Battery 84%', place: 'Allen · 6 h ago', tint: '#f3f6fd' },
        ] },
        { heading: 'Nearby: Ogba, Maryland, Ojodu', count: '9', items: [
          { price: '₦590,000', condition: 'Used', title: 'iPhone 13 Pro Max, Gold', features: '128 GB · Battery 91%', place: 'Maryland · Today', tint: '#fff0f7' },
        ] },
        { heading: 'More in Lagos State', count: '64', items: [
          { price: '₦410,000', condition: 'Used', title: 'iPhone 13, Midnight', features: '128 GB · Delivers to you', place: 'Lekki · Yesterday', tint: '#eef7f2' },
          { price: '₦280,000', condition: 'For parts', title: 'iPhone 13 Pro, cracked back', features: '256 GB · Face ID works', place: 'Surulere · Yesterday', tint: '#f3f6fd' },
        ] },
      ],
    };
  }
}
</script>
</body>
</html>
