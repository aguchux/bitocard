<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose your area</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#c00b58}a:hover{color:#8f0842}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #ffffff; font-family: Inter, system-ui, sans-serif; color: #070f4c; overflow: hidden">

  <header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid #e3e7f2">
    <a href="Main.dc.html" aria-label="Back" style="width: 40px; height: 40px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #070f4c">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7M19 12H5"></path></svg>
    </a>
    <h1 style="margin: 0; font-size: 17px; font-weight: 700">Choose your area</h1>
  </header>

  <div style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <button type="button" style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border-radius: 14px; border: 1px solid #c9cee6; background: #f3f6fd; color: #070f4c; font: 600 14px Inter, sans-serif; text-align: left">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#c00b58" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path><circle cx="12" cy="12" r="7"></circle><circle cx="12" cy="12" r="2"></circle></svg>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 2px">Use my location<span style="font-size: 12px; font-weight: 500; color: #4b5578">Matched to the nearest area on your phone; never sent or kept</span></span>
    </button>
    <label style="display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 12px; border-radius: 12px; border: 1px solid #c9cee6; color: #4b5578">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
      <input type="search" placeholder="Search a state, city or area" aria-label="Search a state, city or area" style="flex: 1; min-width: 0; border: 0; outline: none; font: 500 14px Inter, sans-serif; color: #070f4c">
    </label>
    <nav aria-label="Where you are" style="font-size: 13px; color: #4b5578">Nigeria › <strong style="color: #070f4c">Lagos</strong></nav>
    <button type="button" style="display: flex; justify-content: space-between; align-items: center; height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid #070f4c; background: #ffffff; color: #070f4c; font: 700 14px Inter, sans-serif">All of Lagos State <span style="font-size: 12px; font-weight: 500; color: #4b5578">2,140 listings</span></button>
  </div>

  <ul style="list-style: none; margin: 0; padding: 0 16px; display: flex; flex-direction: column">
    <sc-for list="{{areas}}" as="a" hint-placeholder-count="8">
      <li style="border-bottom: 1px solid #e3e7f2">
        <button type="button" style="width: 100%; display: flex; justify-content: space-between; align-items: center; height: 52px; padding: 0 4px; border: 0; background: transparent; color: #070f4c; font: {{a.weight}} 15px Inter, sans-serif; text-align: left">
          <span style="display: flex; align-items: center; gap: 8px">{{a.name}}
            <sc-if value="{{a.current}}" hint-placeholder-val="{{false}}"><span style="padding: 2px 8px; border-radius: 999px; background: #fff0f7; color: #c00b58; font-size: 11px; font-weight: 700">Chosen</span></sc-if>
          </span>
          <span style="font-size: 12px; font-weight: 500; color: #4b5578">{{a.count}}</span>
        </button>
      </li>
    </sc-for>
  </ul>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const a = (name, count, current) => ({ name, count, current, weight: current ? '700' : '500' });
    return { areas: [a('Ikeja', '412', true), a('Lekki', '386'), a('Surulere', '201'), a('Yaba', '188'), a('Ikorodu', '144'), a('Victoria Island', '132'), a('Ajah', '120'), a('Maryland', '96'), a('Ojodu', '71')] };
  }
}
</script>
</body>
</html>
