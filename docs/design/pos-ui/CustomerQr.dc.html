<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Customer scans the receipt QR code</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #1B1F1D; color: #FFFFFF; display: flex; flex-direction: column; position: relative; overflow: hidden">

<div style="padding: 28px 20px 0; display: flex; justify-content: center">
<span style="font-size: 13px; font-weight: 600; background: rgba(0,0,0,0.55); border-radius: 14px; padding: 6px 12px">Phone camera</span>
</div>

<div style="flex: 1; display: flex; align-items: center; justify-content: center; position: relative">
<div style="width: 250px; height: 300px; border-radius: 18px; background: #F2EFE6; transform: rotate(-4deg); box-shadow: 0 20px 40px rgba(0,0,0,0.5); display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 16px; box-sizing: border-box; color: #000000; font-family: monospace; font-size: 11px">
<span style="font-weight: 700">GET THIS RECEIPT AS A PDF</span>
<svg aria-hidden="true" width="150" height="150" sc-camel-view-box="0 0 25 25" shape-rendering="crispEdges"><path d="{{qr}}" fill="#000000"></path></svg>
<span style="text-align: center">Scan with your phone camera.</span>
</div>
<div style="position: absolute; width: 210px; height: 210px; top: 50%; left: 50%; transform: translate(-50%, -58%); border: 3px solid #3DDC97; border-radius: 22px; box-shadow: 0 0 0 2000px rgba(0,0,0,0.35)"></div>
</div>

<div style="margin: 0 16px 34px; background: #FFFFFF; color: #14201B; border-radius: 20px; padding: 16px; display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border-radius: 12px; background: #E6F3EE; display: flex; align-items: center; justify-content: center; flex: none"><svg aria-hidden="true" width="24" height="24" sc-camel-view-box="0 0 24 24" fill="none" stroke="#0B7A5A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 01-13.5 7.8L3 21l1.2-4.5A9 9 0 1121 12z"></path></svg></div>
<div style="display: flex; flex-direction: column; gap: 2px; flex: 1; min-width: 0">
<span style="font-weight: 700; font-size: 15px">Open in WhatsApp</span>
<span style="font-size: 12px; color: #56635C">Chat with Udozo Receipts · "Receipt POS-10482"</span>
</div>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #0B7A5A; color: #FFFFFF; font-weight: 700; font-size: 14px">Open</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  qrPath() {
    var n = 25, d = '', seed = 48211;
    var rnd = function () { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
    var finder = function (x, y) {
      var c = [[0, 0], [n - 7, 0], [0, n - 7]];
      for (var i = 0; i < 3; i++) {
        var dx = x - c[i][0], dy = y - c[i][1];
        if (dx >= -1 && dx <= 7 && dy >= -1 && dy <= 7) {
          if (dx < 0 || dy < 0 || dx > 6 || dy > 6) return 0;
          if (dx === 0 || dy === 0 || dx === 6 || dy === 6) return 1;
          if (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4) return 1;
          return 0;
        }
      }
      return -1;
    };
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < n; x++) {
        var f = finder(x, y);
        var on = f === -1 ? (y === 6 ? x % 2 === 0 : (x === 6 ? y % 2 === 0 : rnd() < 0.5)) : f === 1;
        if (on) d += 'M' + x + ' ' + y + 'h1v1h-1z';
      }
    }
    return d;
  }
  renderVals() {
    return { qr: this.qrPath() };
  }
}
</script>


</body></html>
